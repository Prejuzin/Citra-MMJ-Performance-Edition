
name: Citra MMJ - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar codigo principal
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Examinar projeto
        run: |
          echo "=== PROJETO ==="
          git log -1 --oneline

          echo "=== SUBMODULOS CONFIGURADOS ==="
          cat .gitmodules || true

          echo "=== ARQUIVOS DE COMPILACAO ==="
          find . -maxdepth 4 \
            \( -name 'CMakeLists.txt' \
            -o -name 'Android.mk' \
            -o -name 'Application.mk' \
            -o -name 'build.gradle' \
            -o -name 'gradlew' \) \
            -print | head -100

          echo "=== DIRETORIOS ==="
          ls -la

          echo "=== ESTRUTURA EXTERNALS ==="
          ls -la externals || true

          echo "=== DIAGNOSTICO CONCLUIDO ==="
