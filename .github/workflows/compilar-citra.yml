name: Compilar Citra MMJ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 📥 Baixar código-fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 🔧 Instalar dependências do sistema
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            unzip \
            openjdk-17-jdk \
            zip \
            && rm -rf /var/lib/apt/lists/*

      - name: 📲 Configurar Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-path: android-ndk

      - name: 📋 Configurar variáveis de ambiente
        run: |
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk" >> $GITHUB_ENV
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: 🏗️ Configurar compilação
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -GNinja

      - name: ⚙️ Compilar projeto
        run: |
          cd build
          ninja -j$(nproc)

      - name: 📦 Montar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: ✅ Coletar APK compilado
        id: collect_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK encontrado: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            ls -lh "$APK_PATH"
          else
            echo "⚠️ APK não encontrado — verifique os passos acima"
            exit 1
          fi

      - name: 📤 Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Citra-MMJ-APK
          path: ${{ steps.collect_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🎉 Compilação finalizada
        run: |
          echo "=========================================="
          echo "  ✅ COMPILAÇÃO CONCLUÍDA COM SUCESSO!   "
          echo "=========================================="
          echo "Baixe o APK na aba 'Artifacts' abaixo ↓"
          
